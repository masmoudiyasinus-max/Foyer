name: foyer
description: "Foyer - Système d'interphone domestique et coordination familiale"
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # WebRTC & Audio
  flutter_webrtc: ^0.9.48
  audioplayers: ^6.0.0

  # Background execution & Lockscreen wake
  flutter_foreground_task: ^6.1.0
  disable_battery_optimization: ^1.1.1
  permission_handler: ^11.3.1

  # Local Discovery (mDNS) & Network
  bonsoir: ^5.1.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Cloud Sync & Signaling (Fallback WAN)
  firebase_core: ^3.3.0
  firebase_database: ^11.0.0

  # UI, Typography & Assets
  google_fonts: ^6.2.1
  flutter_pdfview: ^1.3.2
  file_picker: ^8.0.5
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0A0C10"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#0A0C10"
  color_dark: "#0A0C10"
  image: "assets/app_icon.png"
  android_12:
    image: "assets/app_icon.png"
    icon_background_color: "#0A0C10"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/app_icon.png
    - assets/app_icon.svg

